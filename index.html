    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. MatrixGridCanvas: Interactive Matrix-Dot Grid
    // ==========================================
    const MatrixGridCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const mouse = {
          x: width / 2,
          y: height / 2,
          targetX: width / 2,
          targetY: height / 2,
          isHovering: false,
        };

        let tiltX = 0;
        let tiltY = 0;
        let targetTiltX = 0;
        let targetTiltY = 0;

        const SPACING = 38;
        const INFLUENCE_RADIUS = 190;
        const RIPPLE_SPEED = 3.5;

        const handleResize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.scale(dpr, dpr);
        };

        handleResize();
        window.addEventListener('resize', handleResize);

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.isHovering = true;
          targetTiltX = (mouse.targetX / width - 0.5) * 18;
          targetTiltY = (mouse.targetY / height - 0.5) * 18;
        };

        const handleMouseLeave = () => {
          mouse.isHovering = false;
          targetTiltX = 0;
          targetTiltY = 0;
        };

        const handleTouchMove = (e) => {
          if (e.touches.length > 0) {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            mouse.targetX = touch.clientX - rect.left;
            mouse.targetY = touch.clientY - rect.top;
            mouse.isHovering = true;
            targetTiltX = (mouse.targetX / width - 0.5) * 12;
            targetTiltY = (mouse.targetY / height - 0.5) * 12;
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('touchmove', handleTouchMove, { passive: true });

        let time = 0;

        const render = () => {
          time += 0.02;
          mouse.x += (mouse.targetX - mouse.x) * 0.08;
          mouse.y += (mouse.targetY - mouse.y) * 0.08;
          tiltX += (targetTiltX - tiltX) * 0.05;
          tiltY += (targetTiltY - tiltY) * 0.05;

          ctx.clearRect(0, 0, width, height);

          // Subtle ambient radial glow following mouse
          const bgGradient = ctx.createRadialGradient(
            mouse.x, mouse.y, 10,
            mouse.x, mouse.y, Math.max(width, height) * 0.65
          );
          bgGradient.addColorStop(0, 'rgba(16, 185, 129, 0.06)');
          bgGradient.addColorStop(0.4, 'rgba(6, 78, 59, 0.03)');
          bgGradient.addColorStop(1, 'rgba(13, 17, 23, 0)');
          ctx.fillStyle = bgGradient;
          ctx.fillRect(0, 0, width, height);

          const cols = Math.ceil(width / SPACING) + 2;
          const rows = Math.ceil(height / SPACING) + 2;
          const startX = -SPACING;
          const startY = -SPACING;

          const pointsGrid = [];

          for (let r = 0; r < rows; r++) {
            pointsGrid[r] = [];
            for (let c = 0; c < cols; c++) {
              const originX = startX + c * SPACING;
              const originY = startY + r * SPACING;

              const normDist = Math.sqrt(
                Math.pow((originX - width / 2) / width, 2) +
                Math.pow((originY - height / 2) / height, 2)
              );

              const pShiftX = tiltX * (1 - normDist * 0.5);
              const pShiftY = tiltY * (1 - normDist * 0.5);

              const ambientWave =
                Math.sin(originX * 0.008 + originY * 0.008 + time * 1.5) * 3 +
                Math.cos(originX * 0.005 - time) * 2;

              const dx = originX - mouse.x;
              const dy = originY - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              let rippleOffset = 0;
              let intensity = 0;

              if (dist < INFLUENCE_RADIUS) {
                const factor = 1 - dist / INFLUENCE_RADIUS;
                intensity = Math.pow(factor, 1.8);
                rippleOffset = Math.sin(dist * 0.07 - time * RIPPLE_SPEED) * factor * 14;
              }

              const angle = Math.atan2(dy, dx);
              const drawX = originX + pShiftX + Math.cos(angle) * rippleOffset;
              const drawY = originY + pShiftY + Math.sin(angle) * rippleOffset + ambientWave;

              pointsGrid[r][c] = { x: drawX, y: drawY, intensity, dist };
            }
          }

          // Connecting energized dots
          ctx.lineWidth = 0.75;
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const p = pointsGrid[r][c];
              if (p.intensity > 0.15) {
                if (c + 1 < cols && pointsGrid[r][c + 1].intensity > 0.1) {
                  const rightP = pointsGrid[r][c + 1];
                  const alpha = Math.min(p.intensity, rightP.intensity) * 0.28;
                  ctx.strokeStyle = `rgba(163, 230, 53, ${alpha})`;
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(rightP.x, rightP.y);
                  ctx.stroke();
                }
                if (r + 1 < rows && pointsGrid[r + 1][c].intensity > 0.1) {
                  const bottomP = pointsGrid[r + 1][c];
                  const alpha = Math.min(p.intensity, bottomP.intensity) * 0.28;
                  ctx.strokeStyle = `rgba(16, 185, 129, ${alpha})`;
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(bottomP.x, bottomP.y);
                  ctx.stroke();
                }
              }
            }
          }

          // Matrix Dots
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const p = pointsGrid[r][c];
              let radius = 1.2;
              let dotColor = 'rgba(16, 185, 129, 0.18)';

              if (p.intensity > 0.05) {
                radius = 1.2 + p.intensity * 2.8;
                if (p.intensity > 0.5) {
                  dotColor = `rgba(163, 230, 53, ${0.4 + p.intensity * 0.6})`;
                  ctx.shadowColor = '#a3e635';
                  ctx.shadowBlur = 8 * p.intensity;
                } else {
                  dotColor = `rgba(16, 185, 129, ${0.25 + p.intensity * 0.65})`;
                  ctx.shadowColor = '#10b981';
                  ctx.shadowBlur = 5 * p.intensity;
                }
              } else {
                ctx.shadowBlur = 0;
              }

              ctx.fillStyle = dotColor;
              ctx.beginPath();
              ctx.arc(p.x, p.y, Math.max(0.6, radius), 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.shadowBlur = 0;

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('touchmove', handleTouchMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 block w-full h-full"
          style={{ backgroundColor: '#0d1117' }}
          aria-hidden="true"
        />
      );
    };

    // ==========================================
    // 9. Easter Egg: Custom Cursor Follower & Trailing Light Sparks
    // ==========================================
    const CustomCursor = () => {
      const [isVisible, setIsVisible] = useState(false);
      const [isHoveringClickable, setIsHoveringClickable] = useState(false);
      const dotRef = useRef(null);
      const ringRef = useRef(null);
      const sparksCanvasRef = useRef(null);

      useEffect(() => {
        if (window.matchMedia('(pointer: coarse)').matches) return;

        const mouse = { x: -100, y: -100 };
        const ring = { x: -100, y: -100 };
        const sparks = [];
        let animId;

        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
          if (!isVisible) setIsVisible(true);

          if (Math.random() > 0.45) {
            sparks.push({
              x: mouse.x + (Math.random() - 0.5) * 6,
              y: mouse.y + (Math.random() - 0.5) * 6,
              size: Math.random() * 2 + 1,
              alpha: 0.8,
              color: Math.random() > 0.4 ? '#10b981' : '#a3e635',
            });
          }

          const target = e.target;
          if (
            target.closest('a') ||
            target.closest('button') ||
            target.closest('input') ||
            target.closest('textarea') ||
            target.closest('[role="button"]') ||
            target.closest('.cursor-pointer')
          ) {
            setIsHoveringClickable(true);
          } else {
            setIsHoveringClickable(false);
          }
        };

        const handleMouseLeave = () => setIsVisible(false);

        window.addEventListener('mousemove', handleMouseMove, { passive: true });
        document.addEventListener('mouseleave', handleMouseLeave);

        const canvas = sparksCanvasRef.current;
        const ctx = canvas?.getContext('2d');

        const handleResize = () => {
          if (!canvas) return;
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        handleResize();
        window.addEventListener('resize', handleResize);

        const animate = () => {
          if (dotRef.current) {
            dotRef.current.style.transform = `translate3d(${mouse.x}px, ${mouse.y}px, 0)`;
          }

          ring.x += (mouse.x - ring.x) * 0.18;
          ring.y += (mouse.y - ring.y) * 0.18;

          if (ringRef.current) {
            ringRef.current.style.transform = `translate3d(${ring.x}px, ${ring.y}px, 0)`;
          }

          if (ctx && canvas) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = sparks.length - 1; i >= 0; i--) {
              const s = sparks[i];
              s.alpha -= 0.035;
              s.y += 0.4;
              if (s.alpha <= 0) {
                sparks.splice(i, 1);
                continue;
              }
              ctx.fillStyle = s.color;
              ctx.globalAlpha = Math.max(0, s.alpha);
              ctx.shadowColor = s.color;
              ctx.shadowBlur = 4;
              ctx.beginPath();
              ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
          }

          animId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animId);
        };
      }, [isVisible]);

      return (
        <React.Fragment>
          <canvas
            ref={sparksCanvasRef}
            className="fixed inset-0 pointer-events-none z-[9990] block"
            aria-hidden="true"
          />
          <div
            ref={dotRef}
            aria-hidden="true"
            className={`fixed top-0 left-0 pointer-events-none z-[9999] -translate-x-1/2 -translate-y-1/2 transition-opacity duration-300 ${
              isVisible ? 'opacity-100' : 'opacity-0'
            }`}
          >
            <div
              className={`rounded-full bg-emerald-400 transition-all duration-150 ${
                isHoveringClickable
                  ? 'w-1.5 h-1.5 bg-lime-300 shadow-[0_0_12px_#a3e635]'
                  : 'w-2 h-2 shadow-[0_0_10px_#10b981]'
              }`}
            />
          </div>
          <div
            ref={ringRef}
            aria-hidden="true"
            className={`fixed top-0 left-0 pointer-events-none z-[9998] -translate-x-1/2 -translate-y-1/2 transition-opacity duration-300 ${
              isVisible ? 'opacity-100' : 'opacity-0'
            }`}
          >
            <div
              className={`rounded-full border transition-all duration-300 ${
                isHoveringClickable
                  ? 'w-12 h-12 border-lime-400/80 bg-lime-400/10 shadow-[0_0_20px_rgba(163,230,53,0.3)]'
                  : 'w-8 h-8 border-emerald-400/40 bg-emerald-500/5 shadow-[0_0_15px_rgba(16,185,129,0.2)]'
              }`}
            />
          </div>
        </React.Fragment>
      );
    };

    // ==========================================
    // 10. Magnetic Button Component
    // ==========================================
    const MagneticButton = ({ href, ariaLabel, icon, label }) => {
      const btnRef = useRef(null);
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!btnRef.current) return;
        const rect = btnRef.current.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        setPos({
          x: (e.clientX - centerX) * 0.35,
          y: (e.clientY - centerY) * 0.35,
        });
      };

      return (
        <a
          href={href}
          target="_blank"
          rel="noopener noreferrer"
          aria-label={ariaLabel}
          className="inline-block"
        >
          <div
            ref={btnRef}
            onMouseMove={handleMouseMove}
            onMouseEnter={() => setIsHovered(true)}
            onMouseLeave={() => {
              setIsHovered(false);
              setPos({ x: 0, y: 0 });
            }}
            style={{
              transform: `translate(${pos.x}px, ${pos.y}px)`,
              transition: isHovered
                ? 'transform 0.1s ease-out, border-color 0.2s ease, box-shadow 0.2s ease'
                : 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s ease, box-shadow 0.3s ease',
            }}
            className={`group relative flex items-center gap-3 px-5 py-3 rounded-2xl bg-[#161b22]/90 border border-[#30363d] backdrop-blur-md cursor-pointer select-none ${
              isHovered
                ? 'border-emerald-400 shadow-[0_0_25px_rgba(16,185,129,0.35)] text-white'
                : 'text-slate-300 hover:border-emerald-500/40'
            }`}
          >
            <span className="w-5 h-5 flex items-center justify-center text-emerald-400 group-hover:text-lime-300 transition-colors">
              {icon}
            </span>
            <span className="font-mono text-xs sm:text-sm font-semibold tracking-tight">
              {label}
            </span>
          </div>
        </a>
      );
    };

    // ==========================================
    // 11. Student-Friendly Contact Section
    // ==========================================
    const ContactSection = () => {
      const [formData, setFormData] = useState({ name: '', email: '', message: '' });
      const [submitStatus, setSubmitStatus] = useState('idle');
      const [copiedEmail, setCopiedEmail] = useState(false);
      const directEmail = 'mohitha.aiml.ksit@gmail.com';

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.email || !formData.message) return;

        setSubmitStatus('loading');
        setTimeout(() => {
          setSubmitStatus('success');
          setFormData({ name: '', email: '', message: '' });
          setTimeout(() => setSubmitStatus('idle'), 4000);
        }, 1200);
      };

      const handleCopyEmail = (e) => {
        e.preventDefault();
        navigator.clipboard?.writeText(directEmail);
        setCopiedEmail(true);
        setTimeout(() => setCopiedEmail(false), 2500);
      };

      const icons = {
        github: (
          <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
          </svg>
        ),
        linkedin: (
          <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
          </svg>
        ),
        email: (
          <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        ),
      };

      return (
        <section id="contact" className="relative py-28 px-4 sm:px-6 lg:px-8 border-t border-[#21262d] bg-[#0d1117] overflow-hidden">
          <div className="absolute bottom-10 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-emerald-500/10 rounded-full blur-[140px] pointer-events-none" aria-hidden="true" />
          <div className="relative max-w-5xl mx-auto z-10">
            <div className="rounded-3xl bg-[#121720]/85 backdrop-blur-xl border border-emerald-500/25 p-8 sm:p-12 lg:p-14 shadow-[0_20px_60px_rgba(0,0,0,0.8)] relative overflow-hidden">
              <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 via-teal-400 to-lime-400" />

              <div className="text-center max-w-2xl mx-auto mb-12">
                <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-950/50 border border-emerald-500/35 text-emerald-300 font-mono text-xs mb-4 shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                  <span>// INBOX OPEN FOR OPPORTUNITIES</span>
                </div>
                <h2 className="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-white tracking-tight mb-4">
                  Let’s Collaborate &amp; Build
                </h2>
                <p className="text-slate-300 text-base sm:text-lg leading-relaxed font-normal">
                  Open for summer internships, open-source projects, or tech chats. Drop me a message!
                </p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
                <form onSubmit={handleSubmit} className="lg:col-span-7 space-y-4">
                  <div>
                    <label className="block font-mono text-xs text-slate-300 mb-1.5 font-medium">
                      Your Name <span className="text-emerald-400">*</span>
                    </label>
                    <input
                      type="text"
                      name="name"
                      value={formData.name}
                      onChange={handleChange}
                      required
                      placeholder="e.g. Alex Morgan"
                      className="w-full px-4 py-3 rounded-xl bg-[#070a0e] border border-[#30363d] text-white text-sm focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-all placeholder-slate-600 font-sans"
                    />
                  </div>

                  <div>
                    <label className="block font-mono text-xs text-slate-300 mb-1.5 font-medium">
                      Your Email <span className="text-emerald-400">*</span>
                    </label>
                    <input
                      type="email"
                      name="email"
                      value={formData.email}
                      onChange={handleChange}
                      required
                      placeholder="alex@company.com"
                      className="w-full px-4 py-3 rounded-xl bg-[#070a0e] border border-[#30363d] text-white text-sm focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-all placeholder-slate-600 font-sans"
                    />
                  </div>

                  <div>
                    <label className="block font-mono text-xs text-slate-300 mb-1.5 font-medium">
                      Your Message <span className="text-emerald-400">*</span>
                    </label>
                    <textarea
                      name="message"
                      value={formData.message}
                      onChange={handleChange}
                      required
                      rows="4"
                      placeholder="Tell me about your internship opening, project idea, or say hi..."
                      className="w-full px-4 py-3 rounded-xl bg-[#070a0e] border border-[#30363d] text-white text-sm focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-all placeholder-slate-600 resize-none font-sans"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={submitStatus === 'loading' || submitStatus === 'success'}
                    className={`relative w-full flex items-center justify-center gap-2.5 px-6 py-3.5 rounded-xl font-mono text-sm font-bold transition-all duration-300 transform active:scale-[0.98] cursor-pointer ${
                      submitStatus === 'success'
                        ? 'bg-gradient-to-r from-emerald-400 to-lime-400 text-black shadow-[0_0_25px_rgba(16,185,129,0.5)]'
                        : submitStatus === 'loading'
                        ? 'bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 cursor-wait'
                        : 'bg-gradient-to-r from-emerald-400 to-lime-400 hover:from-emerald-300 hover:to-lime-300 text-black shadow-[0_0_20px_rgba(16,185,129,0.35)] hover:shadow-[0_0_30px_rgba(163,230,53,0.45)]'
                    }`}
                  >
                    {submitStatus === 'loading' ? (
                      <React.Fragment>
                        <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-emerald-400" fill="none" viewBox="0 0 24 24">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                        </svg>
                        <span>Transmitting Dispatch...</span>
                      </React.Fragment>
                    ) : submitStatus === 'success' ? (
                      <span>Message Sent! 🚀</span>
                    ) : (
                      <React.Fragment>
                        <span>Send Message</span>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                      </React.Fragment>
                    )}
                  </button>
                </form>

                <div className="lg:col-span-5 flex flex-col justify-between space-y-6 lg:pl-4">
                  <div>
                    <h3 className="font-mono text-xs font-semibold uppercase tracking-wider text-lime-400 mb-2">
                      Direct Radar Channels
                    </h3>
                    <p className="text-slate-400 text-xs sm:text-sm leading-relaxed mb-6 font-normal">
                      Prefer direct channels? Reach out across professional networks or click below to trigger direct copy.
                    </p>

                    <div className="flex flex-col gap-3.5">
                      <MagneticButton
                        href="https://github.com/mohitha"
                        ariaLabel="Mohitha on GitHub"
                        icon={icons.github}
                        label="GitHub // mohitha"
                      />
                      <MagneticButton
                        href="https://linkedin.com/in/mohitha"
                        ariaLabel="Mohitha on LinkedIn"
                        icon={icons.linkedin}
                        label="LinkedIn // in/mohitha"
                      />
                      <MagneticButton
                        href={`mailto:${directEmail}`}
                        ariaLabel="Send direct email to Mohitha"
                        icon={icons.email}
                        label="Email // ksit.aiml"
                      />
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl bg-[#070a0e]/90 border border-[#30363d] flex items-center justify-between text-xs font-mono">
                    <div className="flex items-center gap-2 overflow-hidden text-ellipsis">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 shrink-0" />
                      <span className="text-slate-300 truncate">{directEmail}</span>
                    </div>
                    <button
                      type="button"
                      onClick={handleCopyEmail}
                      className="shrink-0 px-2.5 py-1 rounded-lg text-emerald-300 hover:text-white bg-emerald-950/60 hover:bg-emerald-900 border border-emerald-500/30 transition-colors cursor-pointer"
                    >
                      {copiedEmail ? '✓ Copied' : 'Copy'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ==========================================
    // 12. Footer
    // ==========================================
    const Footer = () => {
      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer className="relative py-12 px-4 sm:px-6 lg:px-8 border-t border-[#21262d] bg-[#070a0e] text-slate-400 font-mono text-xs overflow-hidden">
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-12 bg-emerald-500/5 blur-xl pointer-events-none" aria-hidden="true" />
          <div className="relative max-w-6xl mx-auto flex flex-col items-center justify-center text-center space-y-4">
            <div className="flex items-center gap-2 text-white font-semibold">
              <span className="text-emerald-400">&lt;</span>
              <span>Mohitha</span>
              <span className="text-lime-400">/&gt;</span>
              <span className="text-slate-600">::</span>
              <span className="text-[11px] text-slate-400">AIML @ KS Institute of Technology</span>
            </div>

            {/* Required Centered Line */}
            <p className="text-sm text-slate-300 font-medium tracking-wide">
              Designed &amp; Engineered by{' '}
              <span className="text-white font-bold">Mohitha</span> • Class of{' '}
              <span className="text-lime-300 font-bold">2027</span>.
            </p>

            <div className="flex flex-wrap items-center justify-center gap-4 pt-2 text-[11px] text-slate-500">
              <span className="flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" />
                <span>Cyber-Emerald v3.0 • Production Ready</span>
              </span>
              <span className="text-slate-700">|</span>
              <button
                type="button"
                onClick={scrollToTop}
                className="hover:text-lime-300 text-slate-400 transition-colors flex items-center gap-1 cursor-pointer"
              >
                <span>Back to Top</span>
                <span className="text-emerald-400">[^]</span>
              </button>
            </div>
          </div>
        </footer>
      );
    };

    // ==========================================
    // Main App Component
    // ==========================================
    const App = () => {
      return (
        <div className="relative min-h-screen bg-[#0d1117] text-slate-100">
          <MatrixGridCanvas />
          <CustomCursor />
          <div className="fixed inset-0 pointer-events-none z-[1] cyber-grid-overlay opacity-30" />
          <Navbar />
          <main className="relative z-10 flex flex-col">
            <Hero />
            <ProjectsSection />
            <SkillsSection />
            <EducationJourneySection />
            <AboutSection />
            <ContactSection />
          </main>
          <Footer />
        </div>
      );
    };

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
